[project]
name = "docfriction"
version = "0.1.0"
description = "Automated friction logs for online documentation, scored section by section with TypeSafe Jev."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cyrus David Pastelero", email = "cyrus@pastelero.ph" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "markdownify>=0.13,<2",
]
keywords = ["documentation", "friction-log", "developer-experience", "jev", "typesafe", "docs-testing", "devrel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.scripts]
docfriction = "docfriction.cli:main"

[project.urls]
Homepage = "https://github.com/Cyvid7-Darus10/docfriction"
Repository = "https://github.com/Cyvid7-Darus10/docfriction"
Issues = "https://github.com/Cyvid7-Darus10/docfriction/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docfriction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["docfriction"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
